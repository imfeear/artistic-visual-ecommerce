services:
  postgres:
    image: postgres:16
    container_name: artistic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: artistic_ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
